[package]
name = "scripting"
version = "0.1.1"
edition = "2021"

[dependencies]
deno_core = "0.400"
v8 = { version = "147", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
oxc_allocator = "0.128"
oxc_parser = "0.128"
oxc_span = "0.128"
oxc_transformer = "0.128"
oxc_codegen = "0.128"
oxc_semantic = "0.128"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
