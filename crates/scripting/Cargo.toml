[package]
name = "scripting"
version = "0.1.2"
edition = "2021"

[dependencies]
rquickjs = "0.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
oxc_allocator = "0.153"
oxc_parser = "0.153"
oxc_span = "0.153"
oxc_transformer = "0.153"
oxc_codegen = "0.153"
oxc_semantic = "0.153"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
