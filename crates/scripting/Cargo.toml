[package]
name = "scripting"
version = "0.1.0"
edition = "2021"

[dependencies]
deno_core = "0.393"
v8 = { version = "146.1", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
oxc_allocator = "0.122"
oxc_parser = "0.122"
oxc_span = "0.122"
oxc_transformer = "0.122"
oxc_codegen = "0.122"
oxc_semantic = "0.122"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
