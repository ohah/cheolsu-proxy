[package]
name = "scripting"
version = "0.1.2"
edition = "2021"

[dependencies]
deno_core = "0.412"
# deno_core 0.410부터 V8 바인딩이 deno_v8 크레이트로 이전됨 (deno_core와 동일 버전 유지)
v8 = { package = "deno_v8", version = "0.4", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
oxc_allocator = "0.144"
oxc_parser = "0.144"
oxc_span = "0.144"
oxc_transformer = "0.144"
oxc_codegen = "0.144"
oxc_semantic = "0.144"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
