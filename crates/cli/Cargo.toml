[package]
name = "cheolsu-cli"
version = "0.1.1"
edition = "2021"

[[bin]]
name = "cheolsu"
path = "src/main.rs"

[dependencies]
cheolsu_ops = { path = "../cheolsu_ops" }
proxy_daemon = { path = "../proxy_daemon" }
proxy_v2_models = { path = "../proxy_v2_models" }
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
parking_lot = "0.12"
serde_json = "1.0"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
