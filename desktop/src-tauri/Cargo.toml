[package]
name = "cheolsu-proxy"
version = "0.1.1"
description = "A Tauri App"
authors = ["ohah", "jinjoo-dev", "wontaezia", "emanuele-em"]
license = "MIT"
repository = "https://github.com/ohah/cheolsu-proxy"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "cheolsu_proxy"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.10.3", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2.5.3"
tauri-plugin-http = "2.5.7"
tauri-plugin-devtools = "2.0.1"
tauri-plugin-clipboard-manager = "2.3.2"
tokio = { version = "1", features = ["full"] }
proxy_daemon = { path = "../../crates/proxy_daemon" }
proxy_v2_models = { path = "../../crates/proxy_v2_models" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.142"
tauri-plugin-fs = "2.4.5"
tauri-plugin-dialog = "2"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "registry", "env-filter"] }
tracing-appender = "0.2"
tauri-plugin-mcp-bridge = "0.11"
reqwest = { version = "0.13", features = ["rustls"], default-features = false }
base64 = "0.22"
tauri-plugin-updater = "2.10.0"
tauri-plugin-single-instance = "2.4.0"
tauri-plugin-global-shortcut = "2"
tauri-plugin-os = "2"
tauri-plugin-store = "2"
qrcode = "0.14"
image = { version = "0.25", default-features = false, features = ["png"] }

[dev-dependencies]
tempfile = "3"
nix = { version = "0.31", features = ["signal", "process"] }

[features]
# this feature is used for production builds or when `devPath` points to the filesystem
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]
