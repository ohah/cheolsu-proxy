name: OpenSSL Bundling Test

on:
  pull_request:
    paths:
      - "desktop/build-mcp.sh"
      - "desktop/src-tauri/build.rs"
      - "desktop/src-tauri/tauri.conf.json"
      - "desktop/tests/test-openssl-bundling.sh"
      - ".github/workflows/openssl-bundling-test.yml"
  push:
    branches: [main]
    paths:
      - "desktop/build-mcp.sh"
      - "desktop/src-tauri/build.rs"
      - "desktop/src-tauri/tauri.conf.json"
      - "desktop/tests/test-openssl-bundling.sh"
      - ".github/workflows/openssl-bundling-test.yml"

jobs:
  test-openssl-bundling:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: true

      - name: Install OpenSSL via Homebrew
        run: brew install openssl@3

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build binaries and prepare OpenSSL dylibs
        working-directory: desktop
        run: bash build-mcp.sh

      - name: Build Tauri app
        run: cargo build -p cheolsu-proxy

      - name: Run OpenSSL bundling tests
        run: bash desktop/tests/test-openssl-bundling.sh
