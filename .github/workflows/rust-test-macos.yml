name: Rust macOS Test

on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "desktop/src-tauri/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/rust-test-macos.yml"
  pull_request:
    branches: [main]
    paths:
      - "crates/**"
      - "desktop/src-tauri/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/rust-test-macos.yml"

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-test-macos:
    name: Rust macOS Test (ignored tests)
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate test CA certificates
        run: |
          openssl req -x509 -newkey rsa:4096 -sha512 -days 3650 -nodes \
            -keyout crates/proxyapi_v2/src/certificate_authority/cheolsu-proxy.key \
            -out crates/proxyapi_v2/src/certificate_authority/cheolsu-proxy.cer \
            -config crates/proxyapi_v2/src/certificate_authority/cheolsu-proxy.cnf \
            -extensions v3_ca
          openssl req -x509 -newkey rsa:2048 -sha256 -days 3650 -nodes \
            -keyout crates/proxyapi_v2/examples/ca/hudsucker.key \
            -out crates/proxyapi_v2/examples/ca/hudsucker.cer \
            -subj "/CN=Hudsucker CA/O=Hudsucker"

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: true
          matcher: true
          rustflags: ""

      - name: Run macOS-only ignored tests
        run: cargo test -p proxyapi_v2 --features full -- --ignored
