# main 푸시 시 GitHub Actions로 문서 사이트 배포 (Settings → Pages → Source: GitHub Actions)
name: Deploy Rspress site to Pages

on:
  push:
    branches: [main]
    paths:
      - "document/**"
      - ".github/workflows/deploy-docs.yml"
  pull_request:
    branches: [main]
    paths:
      - "document/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build with Rspress
        run: bun run --filter cheolsu-proxy-document build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    name: Deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build with Rspress
        run: bun run --filter cheolsu-proxy-document build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: document/doc_build
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
