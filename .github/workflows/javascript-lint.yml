name: JavaScript Lint Check

on:
  push:
    branches: [main]
    paths:
      - "tauri-ui/src/**"
      - ".github/workflows/javascript-lint.yml"
  pull_request:
    branches: [main]
    paths:
      - "tauri-ui/src/**"

jobs:
  javascript-lint:
    name: JavaScript/TypeScript Lint Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting (oxfmt)
        run: bun run format:check

      - name: Run oxlint
        run: bun run lint
