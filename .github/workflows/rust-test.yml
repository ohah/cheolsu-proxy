name: Rust Unit Test

on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "desktop/src-tauri/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/rust-test.yml"
  pull_request:
    branches: [main]
    paths:
      - "crates/**"
      - "desktop/src-tauri/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/rust-test.yml"

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-test:
    name: Rust Unit Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: true
          matcher: true
          rustflags: ""

      - name: Run tests
        env:
          OPENSSL_LIB_DIR: /usr/lib/x86_64-linux-gnu
          OPENSSL_INCLUDE_DIR: /usr/include/openssl
        run: cargo test --workspace --exclude cheolsu-proxy --exclude proxyapi_v2
